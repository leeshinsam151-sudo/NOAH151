<title>유실물 보관소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: one dark station-at-night stage, game screen on top, touch pad below on phones. Single deliberate dark look. */
:root{
  --bg:#060909; --panel:#0b1110; --panel-2:#111a18; --line:#2c3a37; --fg:#cfd8d4; --dim:#7d8e89;
  --accent:#9cc0b5; --warn:#c0565a; --paper:#d9d3c5; --ink:#221e19; --raincoat:#d9b43c;
  --f-story:'Gowun Batang','Noto Serif KR','Batang',serif;
  --f-ui:'Nanum Gothic Coding','D2Coding',ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-story);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;-webkit-tap-highlight-color:transparent}
#app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#stage{position:relative;width:100%;border:1px solid var(--line);background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#fader{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
#hud{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:6}
.hbtn{font-family:var(--f-ui);font-size:12px;letter-spacing:.04em;color:var(--fg);background:rgba(6,10,10,.78);border:1px solid var(--line);padding:5px 9px;cursor:pointer}
.hbtn:focus-visible,.mbtn:focus-visible,.choice:focus-visible,.slide:focus-visible,.kbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hbtn.pulse{animation:pulse 1.2s ease-in-out infinite;border-color:var(--accent)}
@keyframes pulse{50%{background:rgba(60,90,82,.85)}}
#mapname{position:absolute;top:10px;left:12px;z-index:6;font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;color:var(--dim);opacity:0;transition:opacity .8s}
#mapname.on{opacity:1}
#toast{position:absolute;top:40px;left:50%;transform:translateX(-50%);z-index:7;font-family:var(--f-ui);font-size:12px;color:var(--fg);background:rgba(8,14,13,.9);border:1px solid var(--line);padding:6px 12px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#dialog{position:absolute;left:2.5%;right:2.5%;bottom:3%;z-index:8;background:rgba(5,9,9,.93);border:1px solid var(--line);padding:12px 16px 14px;min-height:21%;font-size:clamp(13px,2.15vw,18px);line-height:1.65;cursor:pointer}
#speaker{position:absolute;top:-13px;left:12px;font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;background:var(--panel-2);border:1px solid var(--line);color:var(--accent);padding:2px 8px}
#dtext{white-space:pre-wrap;min-height:1.6em;text-wrap:pretty}
#dtext.narr{color:#aab7b2;font-style:italic}
#dtext.sys{font-family:var(--f-ui);font-size:.85em;color:var(--accent)}
#more{position:absolute;right:12px;bottom:6px;font-size:11px;color:var(--dim);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#choices{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.choice{font:inherit;text-align:left;color:var(--fg);background:transparent;border:1px solid transparent;padding:3px 10px;cursor:pointer}
.choice.sel{border-color:var(--line);background:rgba(80,110,102,.2)}
.choice.sel::before{content:'▸ ';color:var(--accent)}
#title{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 60%,#0f1a18 0%,#040606 70%);text-align:center;padding:16px}
#title h1{font-family:var(--f-story);font-weight:700;font-size:clamp(28px,6vw,54px);letter-spacing:.32em;margin:0 0 0 .32em;color:#dfe6e2;text-shadow:0 0 18px rgba(120,170,155,.25)}
#title .sub{font-family:var(--f-ui);font-size:clamp(11px,1.6vw,13px);letter-spacing:.18em;color:var(--dim);margin:0}
#title .tag{font-size:clamp(12px,1.8vw,15px);color:#9eaca7;margin:6px 0 10px}
#title .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#title .warn{font-family:var(--f-ui);font-size:11px;color:var(--dim);margin-top:8px}
.mbtn{font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);padding:9px 18px;cursor:pointer}
.mbtn:hover{border-color:var(--accent)}
.mbtn.primary{border-color:var(--accent);color:#e6efeb}
.mbtn[disabled]{opacity:.4;cursor:default}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--panel);border:1px solid var(--line);width:100%;max-width:640px;max-height:100%;overflow:auto;padding:18px}
.panel h3{font-family:var(--f-ui);font-size:13px;letter-spacing:.14em;color:var(--accent);margin:0 0 12px;font-weight:700}
.paper{background:var(--paper);color:var(--ink);border:none;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.paper h3{color:#5a5248}
.pbody{white-space:pre-wrap;font-size:16px;line-height:1.8;margin-bottom:14px}
.paper .mbtn{background:#c9c2b3;color:var(--ink);border-color:#a39b8b}
.scratch{background:#2b2620;color:transparent;letter-spacing:.2em}
.mail{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.mail .m{display:grid;grid-template-columns:5.5em 3.5em 1fr;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.mail .m b{font-family:var(--f-ui);font-size:12px;color:var(--accent);font-weight:400}
.mail .m time{font-family:var(--f-ui);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.mail .m.ghost{color:#e3e9e6}
.mail .m.ghost b{color:var(--warn)}
@media (max-width:520px){.mail .m{grid-template-columns:1fr 3.5em}.mail .m span{grid-column:1/-1}}
.keypad .disp{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.keypad .disp span{width:42px;height:50px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:24px;background:#050808}
.keypad .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto 12px}
.kbtn{font-family:var(--f-ui);font-size:18px;padding:12px 0;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);cursor:pointer}
.keypad .msg{text-align:center;font-family:var(--f-ui);font-size:12px;color:var(--dim);margin:0 0 10px}
.btnrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.slides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:520px){.slides{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slide{position:relative;text-align:left;font:inherit;color:var(--fg);cursor:pointer;border:1px solid var(--line);padding:24px 10px 10px;min-height:92px;background:#0d1514 repeating-linear-gradient(0deg,transparent 0 13px,rgba(140,170,160,.07) 13px 14px),repeating-linear-gradient(90deg,transparent 0 27px,rgba(140,170,160,.07) 27px 28px)}
.slide .n{position:absolute;top:5px;left:8px;font-family:var(--f-ui);font-size:11px;color:var(--dim)}
.slide .t{font-weight:700;font-size:14px;display:block}
.slide .d{font-family:var(--f-ui);font-size:12px;color:#a4b3ae;display:block;margin-top:4px}
.slide.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hint{font-family:var(--f-ui);font-size:12px;color:var(--dim);margin:0 0 12px;line-height:1.6}
.clockui{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.clockui canvas{width:170px;height:170px}
.clockui .ctl{display:grid;grid-template-columns:auto auto auto;gap:6px 8px;align-items:center;font-family:var(--f-ui)}
.clockui .val{font-size:22px;text-align:center;min-width:2.4em;font-variant-numeric:tabular-nums}
.clockui .lab{font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;color:var(--dim);background:none;border:1px solid transparent;border-bottom:none;padding:7px 12px;cursor:pointer}
.tab.on{color:var(--fg);border-color:var(--line);background:var(--panel-2)}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.item{border:1px solid var(--line);padding:10px 12px;background:#0a0f0e}
.item b{display:block;font-size:15px;margin-bottom:3px}
.item p{margin:0;font-size:14px;color:#a9b6b1;line-height:1.6;white-space:pre-wrap}
.diary .e{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px dashed var(--line);padding:10px 2px;font-size:15px;line-height:1.7}
.diary .e .tx{min-width:0}
.diary .e.can .tx{text-decoration:underline;text-decoration-color:rgba(156,192,181,.5);text-underline-offset:4px}
.diary .e.doubt .tx::after{content:' ?';color:var(--warn);font-weight:700}
.diary .e.over .tx{font-weight:700;color:#e9efec;letter-spacing:.02em}
.diary .db{flex:none;font-family:var(--f-ui);font-size:11px;color:var(--warn);background:none;border:1px solid #5a3335;padding:4px 8px;cursor:pointer}
.diary .db.on{background:#3a1d1f;color:#f0c9ca}
.empty{color:var(--dim);font-size:14px}
.end h2{font-family:var(--f-story);font-size:22px;margin:0 0 6px;letter-spacing:.1em}
.end .stat{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14px;margin:14px 0;font-variant-numeric:tabular-nums}
.end .stat span:nth-child(even){font-family:var(--f-ui);color:var(--accent)}
#pad{display:none;justify-content:space-between;align-items:center;gap:16px;padding:4px 0}
@media (pointer:coarse),(max-width:700px){#pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;touch-action:none}
.pb{background:var(--panel-2);border:1px solid var(--line);color:var(--fg);font-family:var(--f-ui);font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.pb:active,.pb.on{background:#22312e}
.ab{display:flex;gap:12px;align-items:center}
.ab .pb{width:64px;height:64px;border-radius:50%;font-size:13px}
#help{font-family:var(--f-ui);font-size:12px;color:var(--dim);margin:0;line-height:1.7}
#help kbd{font-family:inherit;border:1px solid var(--line);padding:0 5px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.hbtn.pulse,#more{animation:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv" width="480" height="352" aria-label="게임 화면"></canvas>
    <div id="mapname"></div>
    <div id="hud" hidden>
      <button class="hbtn" id="btnDiary" type="button">일기장</button>
      <button class="hbtn" id="btnMenu" type="button">메뉴</button>
    </div>
    <div id="toast"></div>
    <div id="fader"></div>
    <div id="dialog" hidden>
      <div id="speaker" hidden></div>
      <div id="dtext"></div>
      <div id="choices"></div>
      <div id="more" hidden>▼</div>
    </div>
    <div id="title">
      <p class="sub">녹하역 B1 · 1장 체험판</p>
      <h1>유실물 보관소</h1>
      <p class="tag">깨진 손목시계</p>
      <div class="row">
        <button class="mbtn primary" id="btnNew" type="button">처음부터</button>
        <button class="mbtn" id="btnCont" type="button" disabled>이어하기</button>
      </div>
      <p class="warn">헤드폰 권장 · 소리가 켜집니다</p>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <span></span><button class="pb" data-dir="up" type="button" aria-label="위">▲</button><span></span>
      <button class="pb" data-dir="left" type="button" aria-label="왼쪽">◀</button><span></span><button class="pb" data-dir="right" type="button" aria-label="오른쪽">▶</button>
      <span></span><button class="pb" data-dir="down" type="button" aria-label="아래">▼</button><span></span>
    </div>
    <div class="ab">
      <button class="pb" id="padB" type="button">메뉴</button>
      <button class="pb" id="padA" type="button">조사</button>
    </div>
  </div>
  <p id="help">이동 <kbd>←↑→↓</kbd> / <kbd>WASD</kbd> · 조사·넘기기 <kbd>Z</kbd> <kbd>Space</kbd> <kbd>Enter</kbd> · 메뉴 <kbd>X</kbd> <kbd>Esc</kbd> · 일기장 <kbd>Q</kbd></p>
</div>
<div id="modal" hidden></div>

<script>
(() => {
'use strict';
const TS = 32, VW = 15, VH = 11, W = VW * TS, H = VH * TS, STEP = 0.19;
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const light = document.createElement('canvas'); light.width = W; light.height = H;
const lx = light.getContext('2d');
const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
{ const v = vig.getContext('2d'); const gr = v.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, W*0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.75)'); v.fillStyle = gr; v.fillRect(0, 0, W, H); }

const rnd = (a, b) => a + Math.random() * (b - a);
const hash = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= AUDIO ================= */
const A = { ctx: null, on: false };
function audioInit() {
  if (A.ctx) { A.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  const ctx = new C(); A.ctx = ctx;
  A.master = ctx.createGain(); A.master.gain.value = 0.9; A.master.connect(ctx.destination);
  for (const k of ['amb', 'sfx', 'bgm']) { A[k] = ctx.createGain(); A[k].gain.value = 1; A[k].connect(A.master); }
  const len = ctx.sampleRate * 2;
  A.white = ctx.createBuffer(1, len, ctx.sampleRate); A.brown = ctx.createBuffer(1, len, ctx.sampleRate);
  const w = A.white.getChannelData(0), b = A.brown.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { w[i] = Math.random() * 2 - 1; const x = Math.random() * 2 - 1; last = (last + 0.02 * x) / 1.02; b[i] = last * 3.5; }
  A.on = true;
  if (AMB.pending) { setAmbient(AMB.pending); AMB.pending = null; }
}
const now = () => (A.ctx ? A.ctx.currentTime : 0);
function outNode(pan = 0, bus) {
  bus = bus || A.sfx;
  if (A.ctx.createStereoPanner) { const p = A.ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(bus); return p; }
  return bus;
}
function envG(t, a, peak, d) { const gn = A.ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d); return gn; }
function nburst(o) {
  if (!A.on) return; const ctx = A.ctx; const t = o.t ?? now(); const dur = o.dur ?? 0.1, a = o.a ?? 0.005;
  const s = ctx.createBufferSource(); s.buffer = o.buf || A.white;
  const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f ?? 1000, t);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + a + dur); f.Q.value = o.q ?? 1;
  const gn = envG(t, a, o.peak ?? 0.1, dur);
  s.connect(f).connect(gn).connect(outNode(o.pan || 0, o.bus)); s.start(t, Math.random() * 0.4); s.stop(t + a + dur + 0.05);
}
function tone(o) {
  if (!A.on) return; const ctx = A.ctx; const t = o.t ?? now(); const dur = o.dur ?? 0.5, a = o.a ?? 0.01;
  const os = ctx.createOscillator(); os.type = o.type || 'sine'; os.frequency.setValueAtTime(o.f, t);
  if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + a + dur);
  let node = os;
  if (o.vib) { const l = ctx.createOscillator(); l.frequency.value = 5.2; const lg = ctx.createGain(); lg.gain.value = o.f * 0.012; l.connect(lg).connect(os.frequency); l.start(t); l.stop(t + a + dur + 0.1); }
  if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
  const gn = envG(t, a, o.peak ?? 0.05, dur);
  node.connect(gn).connect(outNode(o.pan || 0, o.bus)); os.start(t); os.stop(t + a + dur + 0.1);
}
function bell(t, f, peak, bus, d = 1.6) { tone({ t, f, a: 0.004, dur: d, peak, bus }); tone({ t, f: f * 2.76, a: 0.004, dur: d * 0.4, peak: peak * 0.25, bus }); }
const SFX = {
  steps(p) { nburst({ dur: .09, peak: .12, type: 'lowpass', f: 260, pan: p, buf: A.brown }); nburst({ t: now() + .55, dur: .09, peak: .1, type: 'lowpass', f: 260, pan: p, buf: A.brown }); },
  door(p) { nburst({ dur: .3, peak: .35, type: 'lowpass', f: 160, pan: p, buf: A.brown }); nburst({ t: now() + .03, dur: .14, peak: .04, type: 'bandpass', f: 1600, q: 3, pan: p }); },
  sigh(p) { nburst({ dur: 1.1, a: .45, peak: .045, type: 'bandpass', f: 950, f2: 330, q: 1.4, pan: p }); },
  phone(p) { const t = now(); for (let i = 0; i < 15; i++) tone({ t: t + i * .045, f: i % 2 ? 1180 : 1480, type: 'square', a: .002, dur: .035, peak: .012, pan: p, lp: 2500 }); },
  chairRoll(p) { nburst({ dur: .9, a: .15, peak: .05, type: 'bandpass', f: 320, q: 2.5, pan: p }); },
  click(p) { nburst({ dur: .02, peak: .07, type: 'highpass', f: 3200, pan: p }); nburst({ t: now() + .13, dur: .02, peak: .05, type: 'highpass', f: 3200, pan: p }); },
  ding(p) { tone({ f: 880, dur: 1.5, peak: .035, pan: p }); tone({ t: now() + .28, f: 698, dur: 1.8, peak: .035, pan: p }); },
  creak(p) { tone({ f: 230, f2: 140, type: 'sawtooth', a: .06, dur: .7, peak: .035, pan: p, lp: 900 }); },
  murmur(p) { const t = now(); for (let i = 0; i < 9; i++) nburst({ t: t + i * .22 + Math.random() * .1, dur: .18, a: .04, peak: .03, type: 'bandpass', f: rnd(380, 720), q: 4, pan: p }); },
  beep(p) { tone({ f: 1046, dur: .12, peak: .045, pan: p }); },
  clink(p) { tone({ f: 2600, dur: .25, peak: .025, pan: p }); tone({ t: now() + .08, f: 3150, dur: .2, peak: .018, pan: p }); },
  drip(p) { tone({ f: 1500, f2: 480, dur: .05, peak: .05, pan: p }); },
  cough(p) { nburst({ dur: .12, peak: .07, type: 'bandpass', f: 520, q: 2, pan: p }); nburst({ t: now() + .26, dur: .1, peak: .05, type: 'bandpass', f: 460, q: 2, pan: p }); },
  blind(p) { const t = now(); for (let i = 0; i < 7; i++) nburst({ t: t + i * .045 + Math.random() * .02, dur: .03, peak: .035, type: 'highpass', f: 2600, pan: p }); },
  train(p) { nburst({ buf: A.brown, dur: 4, a: 1.6, peak: .28, type: 'lowpass', f: 130, pan: p }); },
  childHum(p) { const t = now(); [523, 587, 659, 587, 523, 440].forEach((f, i) => tone({ t: t + i * .48, f, a: .1, dur: .45, peak: .011, pan: p, vib: true, lp: 1400 })); },
  tick() { nburst({ dur: .012, peak: .12, type: 'highpass', f: 4200 }); },
  thud() { tone({ f: 62, f2: 32, dur: 1.3, peak: .4 }); nburst({ buf: A.brown, dur: .7, peak: .35, type: 'lowpass', f: 220 }); },
