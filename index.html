<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<title>감투와 별방울</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="game" width="320" height="240"></canvas>
    <div id="tone" class="layer"></div>
    <div id="fade" class="layer"></div>
    <div id="flash" class="layer"></div>
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="msg">
      <div id="msg-name"></div>
      <canvas id="msg-face" width="48" height="48"></canvas>
      <div id="msg-text"></div>
      <div id="msg-next">▼</div>
    </div>
    <div id="choice"></div>
    <div id="minigame" class="layer"></div>
    <div id="caption" class="layer"></div>
    <div id="menu" class="layer"></div>
    <div id="title" class="layer"></div>
  </div>
  <div id="touch">
    <div id="dpad"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div>
    <div id="btns">
      <div class="btn sw" data-act="switch">감투</div>
      <div class="btn b" data-act="cancel">메뉴</div>
      <div class="btn a" data-act="ok">확인</div>
    </div>
  </div>
</div>

<!-- 엔진 기반 -->
<script src="js/core.js"></script>
<!-- 데이터 (대사·맵·이벤트·음악) -->
